name: ZZZ Code Checker

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zzz-code-checker
  cancel-in-progress: false

jobs:
  check-codes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated codes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Exit if nothing changed
          if git diff --quiet codes.json; then
            echo "No changes."
            exit 0
          fi

          # Save local changes
          git stash push -m "scraper-update"

          # Update local branch
          git pull --rebase origin main

          # Restore changes
          git stash pop || true

          git add codes.json
          git commit -m "Update ZZZ codes"

          git push origin HEAD:main
