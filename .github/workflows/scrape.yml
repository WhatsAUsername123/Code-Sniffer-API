name: ZZZ Code Checker

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  check-codes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Save updated codes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add codes.json

          git commit -m "Update ZZZ codes" || echo "No changes"

          git push
